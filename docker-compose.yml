version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: observability_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: observability
      MYSQL_USER: otel_user
      MYSQL_PASSWORD: otel_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: observability_backend
    restart: always
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=mysql+mysqlconnector://otel_user:otel_pass@db:3306/observability
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: observability_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
